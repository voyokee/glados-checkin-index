name: GLaDOS Checkin

on:
  schedule:
    # 北京时间 14:00–19:30 每 30 分钟 + 20:00 兜底（UTC = 北京时间 - 8）
    - cron: "0,30 6-11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check in
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
        run: python checkin.py
